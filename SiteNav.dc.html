<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div data-sitenav="1" dir="rtl" style="position:relative;font-family:Heebo,sans-serif;overflow-x:clip">
<nav style="background:rgba(18,18,18,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #2a1a1a">
  <div style="position:relative;max-width:1200px;margin:0 auto;padding:12px clamp(14px,4vw,24px);display:flex;align-items:center;justify-content:space-between;gap:12px">
    <a href="home.dc.html#top" style="display:block"><img src="assets/logo.png" alt="COEDIT" style="height:clamp(22px,6vw,30px);width:auto;display:block"></a>
    <div style="display:flex;align-items:center;gap:clamp(6px,2vw,10px)">

        <a href="store.dc.html#login" style="display:flex;align-items:center;gap:8px;height:42px;min-width:42px;justify-content:center;padding:0 {{ loginPad }};border-radius:9px;font-size:15px;font-weight:700;color:#ddd;border:1px solid {{ loginBd }};transition:border-color .2s,color .2s" style-hover="border-color:#333;color:#fff"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg><sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}"><span>התחברות</span></sc-if></a>

      <button onClick="{{ openDrawer }}" aria-label="סל" style="position:relative;width:42px;height:42px;border-radius:9px;background:#1d1d1d;border:1px solid #333;color:#eee;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:border-color .2s,transform .2s" style-hover="border-color:#d93a35;transform:translateY(-2px)"><svg width="20" height="20" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 7H6"></path></svg><sc-if value="{{ hasItems }}" hint-placeholder-val="{{ false }}"><span data-cart-badge="1" style="position:absolute;top:-7px;left:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#d93a35;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 10px rgba(217,58,53,.6)">{{ count }}</span></sc-if></button>

      <a href="home.dc.html#pricing" style="background:linear-gradient(180deg,#e2504a,#c42e2a);color:#fff;font-weight:700;font-size:clamp(14px,3.6vw,15px);height:42px;padding:0 clamp(14px,4vw,20px);white-space:nowrap;border-radius:9px;display:flex;align-items:center;box-shadow:0 0 22px rgba(220,60,55,.35);transition:transform .2s ease,box-shadow .2s ease" style-hover="transform:translateY(-2px);box-shadow:0 0 34px rgba(220,60,55,.6)">מחירים</a>
    </div>
  </div>
</nav>

<div onClick="{{ closeDrawer }}" style="position:fixed;inset:0;z-index:100;background:rgba(10,10,10,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:{{ ovO }};pointer-events:{{ ovPE }};transition:opacity .35s ease"></div>
<div role="dialog" aria-label="סל קניות" style="position:fixed;left:0;right:0;bottom:0;z-index:101;max-height:85vh;display:flex;flex-direction:column;background:#161616;border-top:1px solid #2e2e2e;border-radius:24px 24px 0 0;box-shadow:0 -30px 80px rgba(0,0,0,.6);transform:translateY({{ sheetY }});transition:{{ sheetT }};visibility:{{ sheetVis }}">
  <div onPointerDown="{{ dragStart }}" onPointerMove="{{ dragMove }}" onPointerUp="{{ dragEnd }}" onPointerCancel="{{ dragEnd }}" style="cursor:grab;touch-action:none;flex:none">
    <div style="margin:10px auto 0;width:96px;height:6px;border-radius:999px;background:#3a3a3a"></div>
    <div style="max-width:480px;margin:0 auto;padding:14px 20px 14px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid #262626">
      <b style="display:flex;align-items:center;gap:10px;font-size:19px;color:#fff"><svg width="20" height="20" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 7H6"></path></svg>הסל שלכם ({{ count }} פריטים)</b>
      <span style="font-size:14px;color:#888">רכישות באתר ייפתחו בקרוב.</span>
    </div>
  </div>
  <div style="flex:1;overflow-y:auto">
  <div style="max-width:480px;margin:0 auto;padding:20px">
    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 0;text-align:center">
        <svg width="64" height="64" viewBox="0 0 24 24" style="fill:none;stroke:#3a3a3a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 7H6"></path></svg>
        <span style="font-size:16px;color:#999">הסל ריק</span>
        <a href="home.dc.html#pricing" onClick="{{ closeDrawer }}" style="background:#1d1d1d;border:1px solid #333;color:#eee;font-weight:700;font-size:15px;padding:11px 22px;border-radius:9px;transition:border-color .2s" style-hover="border-color:#d93a35">לבחירת מסלול</a>
      </div>
    </sc-if>
    <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:10px">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="2">
          <div style="display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;background:#1b1b1b;border:1px solid {{ it.bd }}">
            <span style="width:44px;height:44px;flex:none;border-radius:10px;background:{{ it.iconBg }};display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff">{{ it.icon }}</span>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><b style="font-size:15px;color:#fff">{{ it.name }}</b><span style="font-size:13px;color:#888">{{ it.sub }}</span></div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
              <b style="font-size:15px;color:{{ it.priceC }}">{{ it.price }}</b>
              <sc-if value="{{ it.removable }}" hint-placeholder-val="{{ false }}"><button onClick="{{ it.remove }}" aria-label="הסרה" style="width:30px;height:30px;border-radius:7px;background:none;border:1px solid #333;color:#ff6b64;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background .15s,border-color .15s" style-hover="background:#2a1716;border-color:#8a2c28"><svg width="14" height="14" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg></button></sc-if>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="border-top:1px solid #262626;margin-top:20px;padding-top:16px;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between;font-size:14px;color:#aaa"><span>חבילות קרדיטים</span><span>₪{{ packsTotal }}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:14px;color:#aaa"><span>{{ planDueLabel }}</span><span>₪{{ planDue }}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:14px;color:#aaa"><span>מע"מ</span><span>כלול</span></div>
        <div style="border-top:1px solid #262626;padding-top:10px;display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:16px;color:#fff">סה״כ</b><b style="font-size:26px;font-weight:900;color:#fff">₪{{ total }}</b></div>
      </div>
    </sc-if>
  </div>
  </div>
  <div style="flex:none;border-top:1px solid #262626">
    <div style="max-width:480px;margin:0 auto;padding:12px 20px max(18px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button onClick="{{ closeDrawer }}" style="height:48px;background:#1d1d1d;border:1px solid #333;border-radius:10px;color:#eee;font-family:Heebo;font-size:15px;font-weight:700;cursor:pointer;transition:border-color .2s" style-hover="border-color:#d93a35">המשך בקנייה</button>
      <a href="store.dc.html#cart" onClick="{{ goCheckout }}" style="height:48px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#e2504a,#c42e2a);border-radius:10px;color:#fff;font-size:15px;font-weight:800;box-shadow:0 0 22px rgba(220,60,55,.4);opacity:{{ coO }};pointer-events:{{ coPE }};transition:transform .2s,box-shadow .2s" style-hover="transform:translateY(-2px);box-shadow:0 0 32px rgba(220,60,55,.6)">{{ coLabel }}</a>
    </div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const W = () => document.defaultView || window;
const PLANS = { NOOB: { m: 99, cap: 30, cuts: 90 }, PRO: { m: 179, cap: 90, cuts: 300 }, HACKER: { m: 349, cap: 500, cuts: '1,000' } };
const PACKS = { 50: 20, 150: 50, 400: 100, 1000: 200 };
// Cart packs are "<size>:<cat>" (see store.dc.html): credits belong to one usage category.
const CATS = { cz: 'כתוביות וזומים', cuts: 'חיתוכים' };
const parsePack = k => { const m = /^(\d+):(cz|cuts)$/.exec(String(k)); return m && PACKS[m[1]] ? { n: +m[1], cat: m[2] } : null; };
const norm = c => ({ plan: c.plan ?? null, yearly: !!c.yearly, packs: (Array.isArray(c.packs) ? c.packs : []).filter(k => parsePack(k)), loggedIn: !!c.loggedIn });
class Component extends DCLogic {
  state = { cart: norm({}), drawer: false, menu: false, promo: '', promoMsg: '', dragY: 0, dragging: false };
  load() { try { this.setState({ cart: norm(JSON.parse(W().localStorage.getItem('ocedit-cart') || '{}')) }); } catch (e) {} }
  save(cart) { this.setState({ cart }); try { const v = JSON.stringify(norm(cart)); if (W().localStorage.getItem('ocedit-cart') !== v) { W().localStorage.setItem('ocedit-cart', v); W().dispatchEvent(new CustomEvent('ocedit-cart')); } } catch (e) {} }
  count(c) { return (c.plan ? 1 : 0) + c.packs.length; }
  componentDidMount() { this._vw = () => this.setState({ vw: W().innerWidth }); this._vw(); W().addEventListener('resize', this._vw); this._prevSnap = this.state;
    const w = W(); this.load();
    this._l = () => this.load(); w.addEventListener('ocedit-cart', this._l); w.addEventListener('storage', this._l);
    this._doc = e => { if (this.state.menu && !(e.target.closest && e.target.closest('[data-pmenu]'))) this.setState({ menu: false }); };
    document.addEventListener('pointerdown', this._doc);
    this._key = e => { if (e.key === 'Escape') this.setState({ menu: false, drawer: false }); };
    document.addEventListener('keydown', this._key);
  }
  componentWillUnmount() { const w = W(); w.removeEventListener('ocedit-cart', this._l); w.removeEventListener('storage', this._l); document.removeEventListener('pointerdown', this._doc); document.removeEventListener('keydown', this._key); document.body.style.overflow = ''; }
  componentDidUpdate(pp, ps) { if (ps === this._lastPs) return; this._lastPs = ps;
    if (this.count(ps.cart) !== this.count(this.state.cart)) W().requestAnimationFrame(() => { const b = document.querySelector('[data-cart-badge]'); if (b && b.animate) b.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.45)' }, { transform: 'scale(1)' }], { duration: 380, easing: 'cubic-bezier(.34,1.56,.64,1)' }); });
    if (ps.drawer !== this.state.drawer) document.body.style.overflow = this.state.drawer ? 'hidden' : '';
  }
  _after() { if (this._afterQ) return; this._afterQ = true; (document.defaultView || window).setTimeout(() => { this._afterQ = false; const ps = this._prevSnap || this.state; this._prevSnap = this.state; if (ps !== this.state) this.componentDidUpdate(this.props, ps); }, 0); }
  renderVals() {
    this._after();
    const s = this.state, c = s.cart, plan = c.plan ? PLANS[c.plan] : null, n = this.count(c), fmt = x => x.toLocaleString('he-IL');
    const mo = plan ? (c.yearly ? Math.round(plan.m * 0.8) : plan.m) : 0;
    const packsTotal = c.packs.reduce((a, k) => { const p = parsePack(k); return a + (p ? PACKS[p.n] : 0); }, 0);
    const items = [];
    if (plan) items.push({ icon: 'CO', iconBg: 'linear-gradient(180deg,#e2504a,#c42e2a)', name: 'COEDIT ' + c.plan, sub: (c.yearly ? 'שנתי' : 'חודשי') + ' · ' + plan.cap + "/" + plan.cuts + " דק'", price: '₪' + mo + ' / חודש', priceC: '#fff', bd: '#5a2220', removable: true, remove: () => this.save({ ...c, plan: null }) });
    if (plan) items.push({ icon: '◆', iconBg: '#14231a', name: 'COFRAMES', sub: 'החלקת קיפריימים · כלול במנוי', price: 'כלול', priceC: '#5fd068', bd: '#2a2a2a', removable: false, remove: null });
    [...new Set(c.packs)].forEach(k => { const p = parsePack(k); if (!p) return; const q = c.packs.filter(z => z === k).length; items.push({ icon: '⚡', iconBg: '#2a1716', name: fmt(p.n) + ' קרדיטים · ' + CATS[p.cat] + (q > 1 ? ' ×' + q : ''), sub: 'חבילה חד-פעמית · ' + (p.cat === 'cz' ? 'לכתוביות ולזומים בלבד' : 'לחיתוכים בלבד'), price: '₪' + fmt(PACKS[p.n] * q), priceC: '#fff', bd: '#2a2a2a', removable: true, remove: () => this.save({ ...c, packs: c.packs.filter(x => x !== k) }) }); });
    const planDue = plan ? (c.yearly ? mo * 12 : plan.m) : 0;
    const open = s.drawer, dy = s.dragging ? s.dragY : 0;
    const initials = 'ש';
    return {
      wide: (s.vw || 1024) >= 520, loginPad: (s.vw || 1024) >= 520 ? '14px' : '0', loginBd: (s.vw || 1024) >= 520 ? 'transparent' : '#333', loggedIn: c.loggedIn, loggedOut: !c.loggedIn, initials, avatarRing: s.menu ? '#fff' : '#121212',
      toggleMenu: () => this.setState(st => ({ menu: !st.menu })), closeMenu: () => this.setState({ menu: false }),
      menuVis: s.menu ? 'visible' : 'hidden', menuO: s.menu ? 1 : 0, menuY: s.menu ? '0px' : '20px', menuPE: s.menu ? 'auto' : 'none',
      logout: () => { this.setState({ menu: false }); this.save({ ...c, loggedIn: false }); const w = W(); if ((w.location.hash || '').startsWith('#account')) w.location.hash = '#login'; },
      count: n, hasItems: n > 0, isEmpty: n === 0,
      openDrawer: () => this.setState({ drawer: true, menu: false }), closeDrawer: () => this.setState({ drawer: false }),
      ovO: open ? 1 : 0, ovPE: open ? 'auto' : 'none',
      sheetY: open ? dy + 'px' : '105%', sheetT: s.dragging ? 'none' : 'transform .5s cubic-bezier(.32,.72,0,1), visibility 0s linear ' + (open ? '0s' : '.5s'), sheetVis: open ? 'visible' : 'hidden',
      dragStart: e => { this._y0 = e.clientY; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) {} this.setState({ dragging: true, dragY: 0 }); },
      dragMove: e => { if (!s.dragging) return; this.setState({ dragY: Math.max(0, e.clientY - this._y0) }); },
      dragEnd: () => { if (!s.dragging) return; const close = s.dragY > 110; this.setState({ dragging: false, dragY: 0, drawer: close ? false : s.drawer }); },
      items, packsTotal: fmt(packsTotal), planDue: fmt(planDue), planDueLabel: plan ? (c.yearly ? 'מנוי (לשנה)' : 'מנוי (לחודש)') : 'מנוי', total: fmt(planDue + packsTotal),
      coLabel: 'לסיכום ההזמנה', coO: n ? 1 : 0.4, coPE: n ? 'auto' : 'none',
      goCheckout: () => this.setState({ drawer: false })
    };
  }
}
</script>
</body>
</html>
