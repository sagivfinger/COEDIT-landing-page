<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>הורדת COEDIT ל-DaVinci Resolve</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<!-- A fixed link to the newest COEDIT for DaVinci Resolve, for the emails: it downloads whatever
     plugin/resolve/latest.json names (the feed the Resolve app's update check reads). Until that feed
     is published, it says the download is coming soon. Publishing the installer and its feed entry is
     all it takes to make this link work; the emails never change. -->
<style>
html,body{margin:0;background:#121212;color:#ececec;font-family:Heebo,'Segoe UI',-apple-system,Roboto,Arial,sans-serif}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
a{color:#e2504a}
[hidden]{display:none!important}
img{width:56px;height:56px;border-radius:22%}
.btn{display:inline-block;background:#e5403a;color:#fff;font-weight:700;text-decoration:none;padding:14px 26px;border-radius:10px}
.muted{color:#8a8a8a;font-size:14px;max-width:440px;line-height:1.7;margin:0}
</style>
</head>
<body>
<main>
  <img src="/assets/davinci-resolve.png" alt="">
  <h1 id="title" style="margin:0;font-size:24px">מחפשים את הגרסה האחרונה…</h1>
  <p class="muted" id="status"></p>
  <a class="btn" id="dl" href="https://getcoedit.com/" hidden>הורדת COEDIT ל-DaVinci Resolve</a>
  <p class="muted">שאלה? כתבו לנו ל-<a href="mailto:coedit@getcoedit.com" dir="ltr">coedit@getcoedit.com</a></p>
</main>
<script>
(function () {
  var dl = document.getElementById('dl'), title = document.getElementById('title'), status = document.getElementById('status');
  function soon() {
    title.textContent = 'COEDIT ל-DaVinci Resolve יהיה זמין להורדה ממש בקרוב';
    status.textContent = 'המפתח שקיבלתם במייל כבר תקף. ברגע שקובץ ההתקנה יעלה, הקישור הזה יוריד אותו, ותוכלו להשתמש באותו מפתח.';
  }
  fetch('../../../plugin/resolve/latest.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (j) {
      var w = j && j.installer && j.installer.windows;
      if (!j || !/^\d+\.\d+\.\d+$/.test(j.version) || !w || typeof w.url !== 'string' || w.url.indexOf('https://getcoedit.com/') !== 0) throw new Error('bad feed');
      title.textContent = 'ההורדה של COEDIT ל-DaVinci Resolve מתחילה…';
      status.textContent = 'אם ההורדה לא מתחילה תוך כמה שניות, לחצו על הכפתור.';
      dl.href = w.url;
      dl.textContent = 'הורדת COEDIT ל-DaVinci Resolve ' + j.version;
      dl.hidden = false;
      window.location.href = w.url;
    })
    .catch(soon);
})();
</script>
</body>
</html>
