<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#121212;color:#ececec;font-family:Heebo,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#e2504a;text-decoration:none}a:hover{color:#ff6b64}
*{box-sizing:border-box}
input,textarea,select{font-family:Heebo,sans-serif}
</style>
</helmet>
<div dir="rtl" style="min-height:100vh;background:#121212;display:flex;flex-direction:column">

<dc-import name="SiteNav" style="position:sticky;top:0;z-index:40;display:block" hint-size="100%,66px"></dc-import>

<header style="position:relative;overflow:hidden;padding:clamp(40px,8vw,70px) 24px 24px;background:radial-gradient(ellipse 50% 90% at 50% 0%,rgba(217,58,53,.18),transparent 70%)">
  <div style="max-width:880px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center">
    <h1 style="margin:0;font-size:clamp(34px,5vw,56px);font-weight:900;line-height:1.1">{{ title }}</h1>
  </div>
</header>

<main style="flex:1;padding:24px clamp(16px,4vw,24px) 80px">
<div style="max-width:880px;margin:0 auto">

<sc-if value="{{ isDraft }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:14px;padding:clamp(28px,6vw,44px) clamp(18px,5vw,32px)">
  <span style="width:60px;height:60px;border-radius:50%;background:#1f1414;border:1px solid #5a2220;color:#e2504a;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg></span>
  <b style="font-size:22px;color:#fff">המסמך נמצא בהכנה</b>
  <p style="margin:0;max-width:520px;font-size:16px;line-height:1.7;color:#aaa">אנחנו משלימים את פרטי העסק ואת הנוסח המשפטי של המסמך הזה. הוא יפורסם כאן בקרוב.</p>
  <a href="home.dc.html" style="color:#e2504a;font-size:15px;font-weight:700">חזרה לדף הבית</a>
</div>
</sc-if>

<sc-if value="{{ isLegal }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:26px;padding:12px 16px;border-radius:12px;background:#1a1a1a;border:1px solid #2a2a2a">
  <span style="font-size:13px;color:#999">{{ langNote }}</span>
  <div style="display:flex;padding:4px;gap:4px;border-radius:999px;background:#141414;border:1px solid #2e2e2e">
    <button onClick="{{ setHe }}" style="border:none;cursor:pointer;font-family:Heebo;font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;color:{{ heC }};background:{{ heBg }}">עברית</button>
    <button onClick="{{ setEn }}" style="border:none;cursor:pointer;font-family:Heebo;font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;color:{{ enC }};background:{{ enBg }}">English</button>
  </div>
</div>
</sc-if>
<!-- LEGAL:BEGIN -->
<!-- LEGAL:END -->

<sc-if value="{{ isContact }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:14px;padding:clamp(28px,6vw,44px) clamp(18px,5vw,32px)">
  <span style="width:60px;height:60px;border-radius:50%;background:#1f1414;border:1px solid #5a2220;color:#e2504a;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M22 7l-10 6L2 7"></path></svg></span>
  <b style="font-size:22px;color:#fff">צרו קשר באימייל</b>
  <p style="margin:0;max-width:520px;font-size:16px;line-height:1.7;color:#aaa">לכל שאלה או פנייה, כתבו לנו לכתובת:</p>
  <a href="mailto:sagivfinger8@gmail.com" dir="ltr" style="color:#fff;font-size:18px;font-weight:700;overflow-wrap:anywhere">sagivfinger8@gmail.com</a>
  <a href="home.dc.html" style="color:#e2504a;font-size:15px;font-weight:700">חזרה לדף הבית</a>
</div>
</sc-if>

</div>
</main>

<footer style="border-top:1px solid #222;padding:30px 24px">
  <div style="max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
    <img src="assets/logo.png" alt="COEDIT" style="height:24px;width:auto;display:block">
    <div style="display:flex;gap:20px;font-size:14px">
      <a href="terms/" style="color:#888">תנאי שימוש</a><a href="privacy/" style="color:#888">מדיניות פרטיות</a>
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3"><a href="{{ t.href }}" onClick="{{ t.go }}" style="color:#888">{{ t.label }}</a></sc-for>
    </div>
    <span style="font-size:13px;color:#555">© COEDIT</span>
  </div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
// Terms and Privacy are static, script-free pages at terms/ and privacy/. This page no longer renders
// them: #terms and #privacy forward there. LEGAL_READY (the old in-page rendering) stays false.
const LEGAL_READY = false;
class Component extends DCLogic {
  state = { tab: 'contact', lang: 'he' };
  componentDidMount() { this._prevSnap = this.state;
    const w = document.defaultView || window;
    this._h = () => { const t = (w.location.hash || '').slice(1); if (t === 'terms' || t === 'privacy') { w.location.replace(t + '/'); return; } if (t === 'contact') this.setState({ tab: t }); };
    this._h(); w.addEventListener('hashchange', this._h);
    try { const c = JSON.parse((document.defaultView || window).localStorage.getItem('ocedit-cart') || '{}'); this.setState({ navCart: (c.plan ? 1 : 0) + (c.packs || []).filter(k => /^\d+:(cz|cuts)$/.test(String(k))).length, navLogged: !!c.loggedIn }); } catch (e) {}
    w.requestAnimationFrame(() => this.animateIn());
  }
  componentDidUpdate(pp, ps) { if (ps === this._lastPs) return; this._lastPs = ps; if (ps.tab !== this.state.tab) (document.defaultView || window).requestAnimationFrame(() => this.animateIn(document.querySelector('main'))); }
  animateIn(root) { const w = document.defaultView || window; if (w.matchMedia && w.matchMedia('(prefers-reduced-motion: reduce)').matches) return; const sel = 'h1, h2, p, aside, form > *, article > *, [style*="border-radius:14px"], [style*="border-radius:12px"], [style*="border-radius:11px"], [style*="border-radius:10px"], main a[style*="linear-gradient(180deg,#e2504a"]'; const all = [...(root || document).querySelectorAll(sel)].filter(el => !el.closest('nav') && !el.closest('[data-sitenav]') && !el.closest('footer')); const set = new Set(all); const items = all.filter(el => { let p = el.parentElement; while (p) { if (set.has(p)) return false; p = p.parentElement; } return true; }).slice(0, 40); items.forEach((el, i) => { if (el.animate) el.animate([{ opacity: 0, filter: 'blur(8px)', transform: 'translateY(-16px)' }, { opacity: 1, filter: 'blur(0px)', transform: 'translateY(0)' }], { duration: 550, delay: Math.min(i * 70, 700), easing: 'cubic-bezier(.22,.8,.3,1)', fill: 'backwards' }); }); }
  popBadge() { const b = document.querySelector('[data-cart-badge]'); if (b && b.animate) b.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.45)' }, { transform: 'scale(1)' }], { duration: 380, easing: 'cubic-bezier(.34,1.56,.64,1)' }); }

  componentWillUnmount() { (document.defaultView || window).removeEventListener('hashchange', this._h); }
  go(tab) { const w = document.defaultView || window; this.setState({ tab }); try { w.history.replaceState(null, '', '#' + tab); } catch (e) {} w.scrollTo(0, 0); }
  _after() { if (this._afterQ) return; this._afterQ = true; (document.defaultView || window).setTimeout(() => { this._afterQ = false; const ps = this._prevSnap || this.state; this._prevSnap = this.state; if (ps !== this.state) this.componentDidUpdate(this.props, ps); }, 0); }
  renderVals() {
    this._after();
    const tab = this.state.tab;
    const defs = [['terms', 'תנאי שימוש'], ['privacy', 'פרטיות'], ['contact', 'צור קשר']];
    const lang = this.state.lang, en = lang === 'en', legal = LEGAL_READY && (tab === 'terms' || tab === 'privacy');
    const titles = { terms: en && legal ? 'Terms of Use' : 'תנאי שימוש', privacy: en && legal ? 'Privacy Policy' : 'מדיניות פרטיות', contact: 'צור קשר' };
    return {
      navAccountHref: this.state.navLogged ? 'store.dc.html#account' : 'store.dc.html#login', navAccountLabel: this.state.navLogged ? 'החשבון שלי' : 'התחברות', navCartCount: this.state.navCart || 0, navHasCart: (this.state.navCart || 0) > 0,
      title: titles[tab],
      tabs: defs.filter(([id]) => LEGAL_READY || id === 'contact').map(([id, label]) => { const on = id === tab; return { label, href: '#' + id, c: on ? '#fff' : '#999', bg: on ? 'linear-gradient(180deg,#e2504a,#c42e2a)' : 'transparent', sh: on ? '0 0 18px rgba(217,58,53,.45)' : 'none', go: e => { e.preventDefault(); this.go(id); } }; }),
      isLegal: legal, showTermsEn: legal && tab === 'terms' && en, showTermsHe: legal && tab === 'terms' && !en, showPrivacyEn: legal && tab === 'privacy' && en, showPrivacyHe: legal && tab === 'privacy' && !en,
      langNote: en ? 'The English version is the controlling version.' : 'הנוסח האנגלי הוא הנוסח המחייב. הנוסח העברי ניתן לנוחות.',
      setHe: () => this.setState({ lang: 'he' }), setEn: () => this.setState({ lang: 'en' }),
      heC: en ? '#888' : '#fff', heBg: en ? 'transparent' : 'linear-gradient(180deg,#e2504a,#c42e2a)', enC: en ? '#fff' : '#888', enBg: en ? 'linear-gradient(180deg,#e2504a,#c42e2a)' : 'transparent',
      isContact: tab === 'contact', isDraft: !LEGAL_READY && (tab === 'terms' || tab === 'privacy'),
      goContact: e => { e.preventDefault(); this.go('contact'); }
    };
  }
}
</script>
</body>
</html>
